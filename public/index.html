<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Говорилка" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <title>Realtime Mini-App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <div class="role-selector">
        <select id="roleSelect">
          <option value="default">Просто Дилан</option>
          <option value="doctor">Доктор наук</option>
          <option value="teacher">Учительница начальной школы</option>
          <option value="hooligan">Умный хулиган</option>
        </select>
      </div>
      <h1>Говорилка</h1>
      <div class="mic-wrapper">
        <button id="micButton" aria-pressed="false">
          <span class="dot"></span>
        </button>
      </div>
      <div class="status" id="status">Нажмите кнопку для соединения</div>
      <div class="hints">
        <p>
          Говорите после подключения. Ответ будет воспроизводиться
          автоматически.
        </p>
      </div>
      <div class="ios-fix" id="iosFix" style="display: none">
        <button id="fixMicrophoneBtn" class="fix-btn">
          🔧 Восстановить микрофон в Telegram
        </button>
        <p class="fix-hint">
          Если после использования приложения не работает микрофон в Telegram,
          нажмите эту кнопку
        </p>
      </div>
    </div>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/app.js" type="module"></script>
  </body>
</html>
